# ============================================================
# nginx.nonroot.conf - CORRIGÉ FORMATEUR : version non-root (USER 101)
# ============================================================

# Pas de directive "user" : tout tourne déjà sous l'utilisateur non privilégié
worker_processes auto;

# Journaux : l'image les redirige vers la sortie Docker (docker logs)
error_log /var/log/nginx/error.log warn;
pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Dossiers temporaires dans /tmp : un non-root ne peut pas écrire ailleurs
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # --- Sécurité : ne pas divulguer la version de Nginx ---
    server_tokens off;

    # --- Format de journal personnalisé (exploitable plus tard : Wazuh, Loki...) ---
    log_format entreprise 'time=$time_iso8601 '
                          'client=$remote_addr '
                          'xff="$http_x_forwarded_for" '
                          'method=$request_method '
                          'uri="$request_uri" '
                          'status=$status '
                          'bytes=$body_bytes_sent '
                          'rt=$request_time '
                          'ua="$http_user_agent"';

    access_log /var/log/nginx/access.log entreprise;

    # --- Limites contre les abus ---
    client_max_body_size  1m;
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     15s;

    server {
        listen 8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # --- En-têtes de sécurité ("always" : aussi sur les pages d'erreur) ---
        add_header X-Frame-Options         "DENY"        always;
        add_header X-Content-Type-Options  "nosniff"     always;
        add_header Referrer-Policy         "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'" always;

        # --- Méthodes HTTP : lecture seule ---
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        # Sonde de santé (HEALTHCHECK, future supervision)
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # Quel conteneur répond ?
        location = /whoami {
            default_type text/plain;
            return 200 "Conteneur : $hostname\n";
        }

        # Pas d'accès aux fichiers cachés (.git, .env...)
        location ~ /\. {
            deny all;
        }
    }
}
