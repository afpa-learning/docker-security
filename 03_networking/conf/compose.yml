# Déclaration de la liste de services
services:
  reverse-proxy:
    image: docker.io/library/nginx:1.31.6-alpine
    container_name: reverse-proxy
    restart: unless-stopped
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./reverse-proxy/server.crt:/etc/nginx/certs/server.crt:ro
      - ./reverse-proxy/server.key:/etc/nginx/certs/server.key:ro
    depends_on:
      - web-app
    ports:
      - 8443:443
      - 8080:80
    networks:
      - frontend
  # Conteneur de base de données
  db:
    image: docker.io/library/mariadb:13.0.2-ubi
    container_name: web-app-db
    restart: unless-stopped
    # Variables d'environnement disponibles pour le conteneur "db"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    # Re-redirection de port pour accès direct au conteneur
    # ATTENTION : ACCÈS POSSIBLE -> À ENLEVER POUR SÉCURISATION
    # ports:
    #   - 9806:3306
    networks:
      - backend
      
  # Conteneur de l'application web DVWA
  web-app:
    # Image utilisée pour instancier le conteneur
    image: ghcr.io/digininja/dvwa:068d974
    # Nom du conteneur
    container_name: web-app
    # 
    restart: unless-stopped
    # Déclaration des variables d'environnement pour le conteneur "web-app"
    environment:
      # Serveur de base de données utilisé
      # Possibilité de mettre un adresse IP ou, beaucoup mieux, le nom du conteneur ciblé !
      DB_SERVER: db
      DB_PORT: 3306
      DB_DATABASE: ${MARIADB_DATABASE}
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      # Définition du niveau de sécurité de l'application
      DEFAULT_SECURITY_LEVEL: low
    # Liste de dépendance des autres conteneurs
    depends_on:
      - db
    ports:
      - 4280:80
    networks:
      - frontend
      - backend
    
networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24
  backend:
    driver: bridge
    # Blocage des accès à l'extérieur, les conteneurs peuvent toujorus communiqué entre eux
    internal: true
    ipam:
      config:
        - subnet: 172.20.2.0/24
